<line x1="0" y1="48" x2="1200" y2="48" stroke="#1F2A24" stroke-width="2"/>
<circle cx="26" cy="24" r="7" fill="#FF5F56"/><circle cx="48" cy="24" r="7" fill="#FFBD2E"/><circle cx="70" cy="24" r="7" fill="#2ED573"/>
<text x="600.0" y="30" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#8B949E" text-anchor="middle" font-weight="normal">telling django it is behind https</text>
<rect x="40" y="130" width="220" height="90" rx="10" fill="#0F1612" stroke="#58A6FF" stroke-width="2"/><text x="150.0" y="181.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#E6EDF3" text-anchor="middle" font-weight="bold">browser</text><rect x="470" y="130" width="240" height="90" rx="10" fill="#0F1612" stroke="#2ED573" stroke-width="2"/><text x="590.0" y="171.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#E6EDF3" text-anchor="middle" font-weight="bold">NGINX</text><text x="590.0" y="193.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">terminates TLS</text><rect x="920" y="110" width="240" height="130" rx="10" fill="#0F1612" stroke="#2ED573" stroke-width="2"/><text x="1040.0" y="171.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#E6EDF3" text-anchor="middle" font-weight="bold">django</text><text x="1040.0" y="193.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">request.is_secure()</text><line x1="260" y1="175" x2="462" y2="175" stroke="#2ED573" stroke-width="2" marker-end="url(#ag)"/><text x="361.0" y="165.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#2ED573" text-anchor="middle" font-weight="normal">https://</text><line x1="710" y1="175" x2="912" y2="175" stroke="#8B949E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#am)"/><text x="811.0" y="165.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">http:// + header</text><rect x="560" y="270" width="600" height="130" rx="10" fill="#0A0D0C" stroke="#1F2A24" stroke-width="2"/><text x="580" y="300" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#8B949E" text-anchor="start" font-weight="normal"># nginx</text><text x="580" y="325" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#E6EDF3" text-anchor="start" font-weight="normal">proxy_set_header X-Forwarded-Proto $scheme;</text><text x="580" y="355" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#8B949E" text-anchor="start" font-weight="normal"># settings.py</text><text x="580" y="380" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#E6EDF3" text-anchor="start" font-weight="normal">SECURE_PROXY_SSL_HEADER = (&quot;HTTP_X_FORWARDED_PROTO&quot;, &quot;https&quot;)</text><text x="40" y="300" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="15" fill="#FF5F56" text-anchor="start" font-weight="bold">without the header:</text><text x="40" y="328" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#8B949E" text-anchor="start" font-weight="normal">http:// links, redirect loops,</text><text x="40" y="352" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" fill="#8B949E" text-anchor="start" font-weight="normal">secure cookies not sent</text>
<text x="1180" y="416" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="12" fill="#3B4A42" text-anchor="end" font-weight="normal">eduardolucas.dev</text>
</svg>