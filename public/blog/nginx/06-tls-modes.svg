<text x="40" y="100" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#2ED573" text-anchor="start" font-weight="bold">TLS termination</text><rect x="40" y="125" width="220" height="80" rx="10" fill="#0F1612" stroke="#58A6FF" stroke-width="2"/><text x="150.0" y="171.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#E6EDF3" text-anchor="middle" font-weight="bold">browser</text><rect x="490" y="125" width="220" height="80" rx="10" fill="#0F1612" stroke="#2ED573" stroke-width="2"/><text x="600.0" y="161.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#E6EDF3" text-anchor="middle" font-weight="bold">NGINX</text><text x="600.0" y="183.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">decrypts</text><rect x="940" y="125" width="220" height="80" rx="10" fill="#0F1612" stroke="#8B949E" stroke-width="2"/><text x="1050.0" y="161.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#E6EDF3" text-anchor="middle" font-weight="bold">django</text><text x="1050.0" y="183.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">plain HTTP</text><line x1="260" y1="165" x2="482" y2="165" stroke="#2ED573" stroke-width="2" marker-end="url(#ag)"/><text x="371.0" y="155.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#2ED573" text-anchor="middle" font-weight="normal">HTTPS :443</text><line x1="710" y1="165" x2="932" y2="165" stroke="#8B949E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#am)"/><text x="821.0" y="155.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">HTTP (private net)</text><text x="600" y="235" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">NGINX decrypts; backends get plain HTTP</text><text x="40" y="310" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#2ED573" text-anchor="start" font-weight="bold">TLS passthrough / re-encryption</text><rect x="40" y="335" width="220" height="80" rx="10" fill="#0F1612" stroke="#58A6FF" stroke-width="2"/><text x="150.0" y="381.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#E6EDF3" text-anchor="middle" font-weight="bold">browser</text><rect x="490" y="335" width="220" height="80" rx="10" fill="#0F1612" stroke="#2ED573" stroke-width="2"/><text x="600.0" y="371.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#E6EDF3" text-anchor="middle" font-weight="bold">NGINX</text><text x="600.0" y="393.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">forwards</text><rect x="940" y="335" width="220" height="80" rx="10" fill="#0F1612" stroke="#2ED573" stroke-width="2"/><text x="1050.0" y="371.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" fill="#E6EDF3" text-anchor="middle" font-weight="bold">django</text><text x="1050.0" y="393.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">decrypts</text><line x1="260" y1="375" x2="482" y2="375" stroke="#2ED573" stroke-width="2" marker-end="url(#ag)"/><text x="371.0" y="365.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#2ED573" text-anchor="middle" font-weight="normal">HTTPS :443</text><line x1="710" y1="375" x2="932" y2="375" stroke="#2ED573" stroke-width="2" marker-end="url(#ag)"/><text x="821.0" y="365.0" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#2ED573" text-anchor="middle" font-weight="normal">HTTPS</text><text x="600" y="445" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="13" fill="#8B949E" text-anchor="middle" font-weight="normal">encrypted end to end; backend decrypts</text>
